<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Type Loom — Tactile String & Thread Art</title>
  <meta name="description" content="Type, and woven threads grow from your letters. Space cuts the yarn, backspace unravels them.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Main Interactive Canvas -->
    <canvas id="loom-canvas"></canvas>

    <!-- Hidden Typing Input -->
    <input type="text" id="type-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />

    <!-- Top Left Brand Watermark (Type Garden style) -->
    <header class="brand-watermark">
      <div class="brand-title">Type Loom</div>
      <div class="brand-subtitle">Type, and threads weave from your letters. Space cuts the yarn, backspace unravels them.</div>
    </header>

    <!-- Top Right Quick Actions -->
    <div class="top-actions">
      <button id="btn-sound" class="glass-icon-btn" title="Toggle Sound">
        <span id="sound-icon">🔊</span>
      </button>
      <button id="btn-random" class="glass-icon-btn" title="Randomize Preset / Word (Shuffle)">
        <span>🔀</span>
      </button>
      <button id="btn-clear" class="glass-icon-btn" title="Clear Canvas (Esc)">
        <span>🗑️</span>
      </button>
      <button id="btn-export-svg" class="glass-pill-btn" title="Export Vector SVG">
        <span>SVG</span>
      </button>
      <button id="btn-export-png" class="glass-pill-btn highlight" title="Export High-Res PNG">
        <span>Export PNG</span>
      </button>
    </div>

    <!-- Empty State Prompt -->
    <div id="empty-state" class="empty-state">
      <div class="empty-content">
        <span class="empty-cursor">|</span>
        <span class="empty-text">Type to weave your garden...</span>
      </div>
      <div class="empty-hints">
        <span><kbd>Space</kbd> cuts yarn</span>
        <span>•</span>
        <span><kbd>⌫</kbd> unravels</span>
        <span>•</span>
        <span><kbd>Drag</kbd> plucks strings</span>
      </div>
    </div>

    <!-- Type Garden Style Bottom Floating Control Dock -->
    <div class="bottom-dock-container">
      <div class="dock-island">
        <!-- Palette Swatches Section -->
        <div class="dock-section palette-group" id="palette-swatches">
          <!-- Dynamically populated from themes.js -->
        </div>

        <div class="dock-divider"></div>

        <!-- Inline Sliders -->
        <div class="dock-section sliders-group">
          <!-- Tension Slider -->
          <div class="dock-slider-item" title="String Tension / Tightness">
            <span class="slider-label">Tension</span>
            <input type="range" id="slider-tension" min="0.2" max="1.4" step="0.05" value="0.85" />
            <span id="val-tension" class="slider-val">85%</span>
          </div>

          <!-- Gravity Slider -->
          <div class="dock-slider-item" title="Gravity & Catenary Sag">
            <span class="slider-label">Gravity</span>
            <input type="range" id="slider-gravity" min="0.0" max="0.6" step="0.02" value="0.22" />
            <span id="val-gravity" class="slider-val">22</span>
          </div>

          <!-- Density Slider -->
          <div class="dock-slider-item" title="Weaving Passes Density">
            <span class="slider-label">Density</span>
            <input type="range" id="slider-density" min="1" max="5" step="1" value="3" />
            <span id="val-density" class="slider-val">3x</span>
          </div>
        </div>

        <div class="dock-divider"></div>

        <!-- Pin Style Segmented Selector -->
        <div class="dock-section style-group">
          <div class="segmented-control" id="pin-style-control">
            <button class="segment-btn active" data-style="brass" title="Brass Pegs">Brass</button>
            <button class="segment-btn" data-style="pearl" title="Pearl Pins">Pearl</button>
            <button class="segment-btn" data-style="neon" title="Neon Glow Nodes">Neon</button>
            <button class="segment-btn" data-style="none" title="Hide Pins (Threads Only)">None</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="font-glyphs.js"></script>
  <script src="physics.js"></script>
  <script src="themes.js"></script>
  <script src="app.js"></script>
</body>
</html>
