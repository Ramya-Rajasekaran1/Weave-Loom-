<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Type Loom — Tactile Generative Typography by Ramya</title>
  <meta name="description" content="Type to weave living strings and generative typography. An interactive generative art studio by Ramya.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3.3">
</head>
<body>
  <div id="app" class="studio-layout">
    <!-- Top Header Bar -->
    <header class="studio-header">
      <div class="header-left">
        <div class="project-identity">
          <span class="project-tag">Type Loom</span>
          <span class="project-by">by <span class="author-name">Ramya</span></span>
        </div>
        <!-- Keybinding Hints in Header: 2 main core actions -->
        <div class="header-hints" aria-hidden="true">
          <span class="hint-item"><kbd>Type</kbd> weave</span>
          <span class="hint-item"><kbd>Drag</kbd> pluck</span>
        </div>
      </div>

      <div class="header-center">
        <div class="artboard-aspect-control" id="artboard-aspect-control">
          <button class="aspect-btn active" data-aspect="fill" title="Full Screen Canvas">Canvas</button>
          <button class="aspect-btn" data-aspect="poster" title="4:5 Poster Artboard Frame">4:5 Poster</button>
          <button class="aspect-btn" data-aspect="square" title="1:1 Square Frame">1:1 Square</button>
        </div>
      </div>

      <div class="header-right">
        <button id="btn-copy-link" class="header-btn" title="Copy project link" aria-label="Copy Link">
          <span>Copy link</span>
        </button>
        <button id="btn-coffee" class="header-btn" title="Support Ramya" aria-label="Buy me a coffee">
          <span>Buy me a coffee</span>
        </button>
        <button id="btn-export-svg" class="header-btn" title="Download Vector SVG" aria-label="Export SVG">
          <span>SVG</span>
        </button>
        <button id="btn-export-png" class="header-btn primary" title="Download High-Res Snapshot" aria-label="Export PNG">
          <span>Export Image</span>
        </button>
      </div>
    </header>

    <!-- Studio Workspace with Framed Artboard -->
    <main class="studio-workspace" id="studio-workspace">
      <div class="artboard-container frame-fill" id="artboard-container">
        <canvas id="loom-canvas"></canvas>
        
        <!-- Interactive Empty Blinking Cursor State in the Center -->
        <div id="empty-state" class="empty-state">
          <div class="centered-prompt">
            <span class="blinking-needle">|</span>
            <span class="placeholder-text">Type anything to weave...</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Hidden Input for keyboard capture -->
    <input type="text" id="type-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus aria-label="Interactive typing input" />

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification" role="status" aria-live="polite">Link copied!</div>

    <!-- Bottom Floating Dock Container -->
    <div class="bottom-dock-wrapper" id="bottom-dock-wrapper">
      
      <!-- Horizontal Sub-Ribbon Row (Appears on one line just above the dock on click) -->
      <div class="dock-sub-ribbon" id="dock-sub-ribbon">
        <!-- Palette Sub-Bar Row -->
        <div class="sub-ribbon-content" id="sub-ribbon-palettes">
          <!-- Dynamically populated from themes.js -->
        </div>

        <!-- Motion Effects Sub-Bar Row: Luminous Needle before Twin Shuttles, Plasma removed -->
        <div class="sub-ribbon-content" id="sub-ribbon-effects">
          <button class="ribbon-opt active" data-motion="breathe">
            <span class="r-badge">01</span>
            <span class="r-title">Breathe</span>
          </button>
          <button class="ribbon-opt" data-motion="gust">
            <span class="r-badge">02</span>
            <span class="r-title">Wind Gust</span>
          </button>
          <button class="ribbon-opt" data-motion="visitor">
            <span class="r-badge">03</span>
            <span class="r-title">Luminous Needle</span>
          </button>
          <button class="ribbon-opt" data-motion="shuttles">
            <span class="r-badge">04</span>
            <span class="r-title">Twin Shuttles</span>
          </button>
        </div>
      </div>

      <!-- Main Figma-Inspired Bottom Centered Glass Toolbar (Strictly single horizontal line) -->
      <nav class="figma-bottom-dock" aria-label="Loom Controls">
        <!-- 1. Color Palette Selector Trigger -->
        <button class="dock-item" id="palette-menu-trigger" title="Choose Color Palette">
          <span class="dock-label">Palette</span>
          <div class="palette-indicator" id="current-palette-preview">
            <div class="preview-dot dot-1"></div>
            <div class="preview-dot dot-2"></div>
            <div class="preview-dot dot-3"></div>
          </div>
          <span class="chevron" id="palette-chevron">▾</span>
        </button>

        <div class="dock-divider"></div>

        <!-- 2. Effects & Motion Switcher Trigger -->
        <button class="dock-item" id="motion-menu-trigger" title="Choose Kinetic Effect">
          <span class="dock-label">Effect</span>
          <span class="active-effect-name" id="active-effect-name">Breathe</span>
          <span class="chevron" id="motion-chevron">▾</span>
        </button>

        <div class="dock-divider"></div>

        <!-- 3. Pins On / Off Toggle Button -->
        <button id="btn-toggle-pins" class="dock-btn active" title="Toggle Anchor Pins" aria-label="Toggle Anchor Pins">
          <span class="status-dot active" id="pins-status-dot"></span>
          <span id="pins-status-text" class="btn-text-nowrap">Pins: On</span>
        </button>

        <div class="dock-divider"></div>

        <!-- 4. Snow / Glowing Dots On / Off Toggle Button -->
        <button id="btn-toggle-flakes" class="dock-btn active" title="Toggle Falling Glowing Dots / Snowflakes" aria-label="Toggle Falling Snowflakes">
          <span class="status-dot active" id="flakes-status-dot"></span>
          <span id="flakes-status-text" class="btn-text-nowrap">Snow: On</span>
        </button>

        <div class="dock-divider"></div>

        <!-- 5. Thread Stroke Thickness Slider (Increased Default Stroke) -->
        <div class="dock-item stroke-control" title="Adjust Thread Thickness">
          <span class="dock-label">Stroke</span>
          <input type="range" id="slider-stroke" min="1" max="8" step="0.5" value="3.5" aria-label="Stroke Thickness" />
          <span id="val-stroke" class="dock-val">3.5px</span>
        </div>

        <div class="dock-divider"></div>

        <!-- 5. Sound Synthesizer Toggle Button -->
        <button id="btn-toggle-sound" class="dock-btn" title="Toggle Acoustic Sound" aria-label="Toggle Sound">
          <span class="status-dot active" id="sound-status-dot"></span>
          <span id="sound-status-text" class="btn-text-nowrap">Audio: On</span>
        </button>

        <div class="dock-divider"></div>

        <!-- 6. Clear Canvas Action -->
        <button id="btn-clear-canvas" class="dock-btn clear" title="Clear Canvas (Enter / Esc)" aria-label="Clear Canvas">
          <span>Clear</span>
        </button>
      </nav>
    </div>
  </div>

  <script src="audio.js?v=3.3"></script>
  <script src="font-glyphs.js?v=3.3"></script>
  <script src="physics.js?v=3.3"></script>
  <script src="themes.js?v=3.3"></script>
  <script src="app.js?v=3.3"></script>
</body>
</html>
