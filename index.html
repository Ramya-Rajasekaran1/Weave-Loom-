<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Type Loom — Tactile Generative Typography by Ramya</title>
  <meta name="description" content="Type to weave living strings and generative typography. An interactive generative art studio by Ramya.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="studio-layout">
    <!-- Top Header Bar -->
    <header class="studio-header">
      <div class="header-left">
        <span class="project-tag">Type Loom</span>
        <span class="project-by">by <a href="#" class="author-link" id="author-link">Ramya</a></span>
      </div>

      <div class="header-center">
        <div class="artboard-aspect-control" id="artboard-aspect-control">
          <button class="aspect-btn active" data-aspect="fill" title="Full Screen Canvas">Canvas</button>
          <button class="aspect-btn" data-aspect="poster" title="4:5 Poster Artboard Frame">4:5 Poster</button>
          <button class="aspect-btn" data-aspect="square" title="1:1 Square Frame">1:1 Square</button>
        </div>
      </div>

      <div class="header-right">
        <button id="btn-copy-link" class="header-btn" title="Copy project link" aria-label="Copy Link">
          <span>Copy link</span>
        </button>
        <button id="btn-coffee" class="header-btn" title="Support Ramya" aria-label="Buy me a coffee">
          <span>Buy me a coffee</span>
        </button>
        <button id="btn-export-svg" class="header-btn" title="Download Vector SVG" aria-label="Export SVG">
          <span>SVG</span>
        </button>
        <button id="btn-export-png" class="header-btn primary" title="Download High-Res Snapshot" aria-label="Export PNG">
          <span>Export Image</span>
        </button>
      </div>
    </header>

    <!-- Studio Workspace with Framed Artboard -->
    <main class="studio-workspace" id="studio-workspace">
      <div class="artboard-container frame-fill" id="artboard-container">
        <canvas id="loom-canvas"></canvas>
        
        <!-- Interactive Empty Blinking Cursor State in the Center -->
        <div id="empty-state" class="empty-state">
          <div class="centered-prompt">
            <span class="blinking-needle">|</span>
            <span class="placeholder-text">Type anything to weave...</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Hidden Input for keyboard capture -->
    <input type="text" id="type-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus aria-label="Interactive typing input" />

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification" role="status" aria-live="polite">Link copied!</div>

    <!-- Bottom Left Keybinding Microcopy -->
    <div class="keyboard-hints" aria-hidden="true">
      <span><kbd>Type</kbd> to weave</span>
      <span><kbd>Space</kbd> cuts yarn</span>
      <span><kbd>⌫</kbd> unravels</span>
      <span><kbd>Enter</kbd> clears</span>
      <span><kbd>Drag</kbd> plucks strings</span>
    </div>

    <!-- Figma-Inspired Bottom Centered Glass Action Toolbar -->
    <nav class="figma-bottom-dock" aria-label="Loom Controls">
      <!-- 1. Color Palette Selector -->
      <div class="dock-item dropdown-trigger" id="palette-menu-trigger">
        <div class="dock-label">Palette</div>
        <div class="palette-indicator" id="current-palette-preview">
          <div class="preview-dot dot-1"></div>
          <div class="preview-dot dot-2"></div>
          <div class="preview-dot dot-3"></div>
        </div>
        <span class="chevron">▾</span>

        <!-- Palette Dropdown Popover -->
        <div class="dock-popover palette-popover" id="palette-popover">
          <div class="popover-title">Color Palettes</div>
          <div class="palette-list" id="palette-list">
            <!-- Dynamically populated from themes.js -->
          </div>
        </div>
      </div>

      <div class="dock-divider"></div>

      <!-- 2. Effects & Motion Switcher (5 Working Effects) -->
      <div class="dock-item dropdown-trigger" id="motion-menu-trigger">
        <div class="dock-label">Effect</div>
        <span class="active-effect-name" id="active-effect-name">Breathe</span>
        <span class="chevron">▾</span>

        <!-- Effects Popover -->
        <div class="dock-popover motion-popover" id="motion-popover">
          <div class="popover-title">Kinetic Effects</div>
          <div class="motion-list">
            <button class="motion-opt active" data-motion="breathe">
              <span class="motion-badge">01</span>
              <div class="motion-info">
                <span class="m-title">Breathe</span>
                <span class="m-desc">Organic harmonic wave · 3s</span>
              </div>
            </button>
            <button class="motion-opt" data-motion="gust">
              <span class="motion-badge">02</span>
              <div class="motion-info">
                <span class="m-title">Wind Gust</span>
                <span class="m-desc">Dynamic physics breeze · 4s</span>
              </div>
            </button>
            <button class="motion-opt" data-motion="reach">
              <span class="motion-badge">03</span>
              <div class="motion-info">
                <span class="m-title">Magnetic Reach</span>
                <span class="m-desc">Strings follow cursor light · 5s</span>
              </div>
            </button>
            <button class="motion-opt" data-motion="resonate">
              <span class="motion-badge">04</span>
              <div class="motion-info">
                <span class="m-title">Resonate</span>
                <span class="m-desc">Acoustic string twangs · 4s</span>
              </div>
            </button>
            <button class="motion-opt" data-motion="visitor">
              <span class="motion-badge">05</span>
              <div class="motion-info">
                <span class="m-title">Luminous Needle</span>
                <span class="m-desc">Flying visitor loops · 6s</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <div class="dock-divider"></div>

      <!-- 3. Thread Stroke Thickness Slider -->
      <div class="dock-item stroke-control" title="Thread Thickness">
        <div class="dock-label">Stroke</div>
        <input type="range" id="slider-stroke" min="1" max="6" step="0.5" value="2.5" aria-label="Stroke Thickness" />
        <span id="val-stroke" class="dock-val">2.5px</span>
      </div>

      <div class="dock-divider"></div>

      <!-- 4. Pin / Bubble Toggle Button -->
      <button id="btn-toggle-pins" class="dock-btn" title="Toggle Pin Pegs" aria-label="Toggle Pins">
        <span class="status-dot active" id="pin-status-dot"></span>
        <span id="pin-status-text">Pins: On</span>
      </button>

      <div class="dock-divider"></div>

      <!-- 5. Sound Synthesizer Toggle Button -->
      <button id="btn-toggle-sound" class="dock-btn" title="Toggle Acoustic Sound" aria-label="Toggle Sound">
        <span class="status-dot active" id="sound-status-dot"></span>
        <span id="sound-status-text">Audio: On</span>
      </button>

      <div class="dock-divider"></div>

      <!-- 6. Clear Canvas Action -->
      <button id="btn-clear-canvas" class="dock-btn clear" title="Clear Canvas (Enter / Esc)" aria-label="Clear Canvas">
        <span>Clear</span>
      </button>
    </nav>
  </div>

  <script src="audio.js"></script>
  <script src="font-glyphs.js"></script>
  <script src="physics.js"></script>
  <script src="themes.js"></script>
  <script src="app.js"></script>
</body>
</html>
